<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomy AR Overlay</title>
  <!-- MediaPipe Pose and Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #ui {
      position: absolute; top: 16px; left: 16px; color: #00ffcc;
      background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 8px; font-size: 14px;
    }
  </style>
</head>
<body>

<div id="container">
  <video id="webcam" playsinline></video>
  <canvas id="output_canvas"></canvas>
  <div id="ui">AR Body Overlay: Active</div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');

  function onResults(results) {
    canvasElement.width = videoElement.videoWidth;
    canvasElement.height = videoElement.videoHeight;
    
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    
    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;
      
      // Extract key torso joints (Normalized coordinates 0.0 - 1.0)
      const lShoulder = { x: lm[11].x * canvasElement.width, y: lm[11].y * canvasElement.height };
      const rShoulder = { x: lm[12].x * canvasElement.width, y: lm[12].y * canvasElement.height };
      const lHip      = { x: lm[23].x * canvasElement.width, y: lm[23].y * canvasElement.height };
      const rHip      = { x: lm[24].x * canvasElement.width, y: lm[24].y * canvasElement.height };

      // Calculate torso midpoint & rib cage boundaries
      const neckX = (lShoulder.x + rShoulder.x) / 2;
      const neckY = (lShoulder.y + rShoulder.y) / 2;
      const spineBottomX = (lHip.x + rHip.x) / 2;
      const spineBottomY = (lHip.y + rHip.y) / 2;

      // 1. Draw Anatomical Spine Line
      canvasCtx.beginPath();
      canvasCtx.moveTo(neckX, neckY);
      canvasCtx.lineTo(spineBottomX, spineBottomY);
      canvasCtx.lineWidth = 8;
      canvasCtx.strokeStyle = '#00e5ff';
      canvasCtx.shadowBlur = 10;
      canvasCtx.shadowColor = '#00e5ff';
      canvasCtx.stroke();

      // 2. Draw Rib Cage Overlay Lines
      const ribCount = 5;
      for (let i = 1; i <= ribCount; i++) {
        const factor = i / (ribCount + 1);
        const currY = neckY + (spineBottomY - neckY) * factor;
        const widthFactor = Math.sin(factor * Math.PI) * (Math.abs(rShoulder.x - lShoulder.x) * 0.45);

        canvasCtx.beginPath();
        canvasCtx.ellipse(neckX, currY, widthFactor, 12, 0, 0, 2 * Math.PI);
        canvasCtx.lineWidth = 3;
        canvasCtx.strokeStyle = '#39ff14';
        canvasCtx.stroke();
      }

      // 3. Highlight Joint Nodes (Shoulders & Hips)
      [lShoulder, rShoulder, lHip, rHip].forEach(pt => {
        canvasCtx.beginPath();
        canvasCtx.arc(pt.x, pt.y, 10, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#ff0055';
        canvasCtx.fill();
      });
    }
    canvasCtx.restore();
  }

  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });
  camera.start();
</script>

</body>
</html>
